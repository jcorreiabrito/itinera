packages:
  - '.'

# pnpm: allow esbuild (used by Vite) to run its install script.
# (pnpm 10 reads `onlyBuiltDependencies`; the previous key `allowBuilds` is not
# a pnpm setting and was silently ignored.)
onlyBuiltDependencies:
  - esbuild
# Don't force a reinstall before every `pnpm run <script>` (lets scripts run
# against the existing node_modules even if a dependency is unavailable offline).
verifyDepsBeforeRun: false
